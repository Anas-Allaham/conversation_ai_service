openapi: 3.1.0
info:
  title: Oral Assessment Service
  description: Original CEFR-aligned adaptive oral placement service. This service
    reports a conversational interaction profile and does not issue official CEFR
    certification.
  version: 0.3.0
paths:
  /health/live:
    get:
      summary: Health Live
      operationId: health_live_health_live_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Live Health Live Get
  /health/ready:
    get:
      summary: Health Ready
      operationId: health_ready_health_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Health Ready Health Ready Get
  /metrics:
    get:
      summary: Metrics
      operationId: metrics_metrics_get
      responses:
        '200':
          description: Successful Response
          content:
            text/plain:
              schema:
                type: string
  /v1/assessments:
    post:
      summary: Create Assessment
      operationId: create_assessment_v1_assessments_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssessmentCreateRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentCreateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/assessments/{assessment_id}:
    get:
      summary: Get Assessment State
      operationId: get_assessment_state_v1_assessments__assessment_id__get
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
          title: Assessment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentStateResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/assessments/{assessment_id}/responses:
    post:
      summary: Submit Response
      operationId: submit_response_v1_assessments__assessment_id__responses_post
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
          title: Assessment Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponseSubmission'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/assessments/{assessment_id}/audio/{response_id}:
    post:
      summary: Upload Original Audio
      operationId: upload_original_audio_v1_assessments__assessment_id__audio__response_id__post
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
          title: Assessment Id
      - name: response_id
        in: path
        required: true
        schema:
          type: string
          title: Response Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_original_audio_v1_assessments__assessment_id__audio__response_id__post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioUploadResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/assessments/{assessment_id}/result:
    get:
      summary: Get Result
      operationId: get_result_v1_assessments__assessment_id__result_get
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
          title: Assessment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/assessments/{assessment_id}/evidence:
    get:
      summary: Get Assessment Evidence
      description: Return auditable scoring evidence for the application/backend team.
      operationId: get_assessment_evidence_v1_assessments__assessment_id__evidence_get
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
          title: Assessment Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssessmentEvidenceResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/assessments/{assessment_id}/cancel:
    post:
      summary: Cancel Assessment
      operationId: cancel_assessment_v1_assessments__assessment_id__cancel_post
      parameters:
      - name: assessment_id
        in: path
        required: true
        schema:
          type: string
          title: Assessment Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/pronunciation/callback:
    post:
      summary: Pronunciation Callback
      operationId: pronunciation_callback_v1_pronunciation_callback_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PronunciationResultEvent'
        required: true
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/versions/activate:
    post:
      summary: Activate Version
      operationId: activate_version_v1_admin_versions_activate_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionActivationRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionActivationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/admin/retention/cleanup:
    post:
      summary: Retention Cleanup
      operationId: retention_cleanup_v1_admin_retention_cleanup_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetentionResponse'
  /v1/fluency/sessions/{session_id}/turns:
    post:
      summary: Submit Fluency Turn
      operationId: submit_fluency_turn_v1_fluency_sessions__session_id__turns_post
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FluencyObservationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FluencyTurnResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/fluency/sessions/{session_id}:
    get:
      summary: Get Fluency Session
      operationId: get_fluency_session_v1_fluency_sessions__session_id__get
      parameters:
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: mode
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/FluencyMode'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FluencySessionResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AssessmentCreateRequest:
      properties:
        user_id:
          type: string
          maxLength: 128
          minLength: 1
          title: User Id
        assessment_type:
          type: string
          const: conversational-placement
          title: Assessment Type
          default: conversational-placement
        target_range:
          items:
            $ref: '#/components/schemas/CEFRLevel'
          type: array
          title: Target Range
        language:
          type: string
          const: en
          title: Language
          default: en
        interface_language:
          type: string
          enum:
          - en
          - ar
          title: Interface Language
          default: en
        form_seed:
          anyOf:
          - type: string
            maxLength: 128
          - type: 'null'
          title: Form Seed
      additionalProperties: false
      type: object
      required:
      - user_id
      title: AssessmentCreateRequest
    AssessmentCreateResponse:
      properties:
        assessment_id:
          type: string
          title: Assessment Id
        status:
          $ref: '#/components/schemas/AssessmentStatus'
        current_item:
          $ref: '#/components/schemas/CurrentPrompt'
        assessment_version:
          type: string
          title: Assessment Version
        item_bank_version:
          type: string
          title: Item Bank Version
        progress:
          $ref: '#/components/schemas/AssessmentProgress'
      additionalProperties: false
      type: object
      required:
      - assessment_id
      - status
      - current_item
      - assessment_version
      - item_bank_version
      - progress
      title: AssessmentCreateResponse
    AssessmentEvidenceResponse:
      properties:
        assessment_id:
          type: string
          title: Assessment Id
        versions:
          additionalProperties:
            type: string
          type: object
          title: Versions
        responses:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Responses
      additionalProperties: false
      type: object
      required:
      - assessment_id
      - versions
      - responses
      title: AssessmentEvidenceResponse
    AssessmentProgress:
      properties:
        status:
          $ref: '#/components/schemas/AssessmentStatus'
        current_section:
          type: string
          title: Current Section
        current_prompt_kind:
          anyOf:
          - $ref: '#/components/schemas/PromptKind'
          - type: 'null'
        questions_answered:
          type: integer
          minimum: 0.0
          title: Questions Answered
        confirmed_levels:
          items:
            $ref: '#/components/schemas/CEFRLevel'
          type: array
          title: Confirmed Levels
        estimated_questions_remaining_min:
          type: integer
          minimum: 0.0
          title: Estimated Questions Remaining Min
        estimated_questions_remaining_max:
          type: integer
          minimum: 0.0
          title: Estimated Questions Remaining Max
        adaptive_length:
          type: boolean
          const: true
          title: Adaptive Length
          default: true
        display_text:
          type: string
          title: Display Text
      additionalProperties: false
      type: object
      required:
      - status
      - current_section
      - current_prompt_kind
      - questions_answered
      - estimated_questions_remaining_min
      - estimated_questions_remaining_max
      - display_text
      title: AssessmentProgress
    AssessmentRecord:
      properties:
        assessment_id:
          type: string
          title: Assessment Id
        user_id:
          type: string
          title: User Id
        status:
          $ref: '#/components/schemas/AssessmentStatus'
        current_level_index:
          type: integer
          maximum: 4.0
          minimum: 0.0
          title: Current Level Index
        current_item_id:
          type: string
          title: Current Item Id
        current_prompt_kind:
          $ref: '#/components/schemas/PromptKind'
        current_prompt_id:
          type: string
          title: Current Prompt Id
        highest_confirmed_level:
          anyOf:
          - $ref: '#/components/schemas/CEFRLevel'
          - type: 'null'
        first_unconfirmed_level:
          anyOf:
          - $ref: '#/components/schemas/CEFRLevel'
          - type: 'null'
        provisional_unconfirmed_level:
          anyOf:
          - $ref: '#/components/schemas/CEFRLevel'
          - type: 'null'
        early_boundary_verification_used:
          type: boolean
          title: Early Boundary Verification Used
          default: false
        boundary_verification_levels:
          items:
            $ref: '#/components/schemas/CEFRLevel'
          type: array
          title: Boundary Verification Levels
        form_seed:
          type: string
          title: Form Seed
        invalid_audio_count:
          type: integer
          title: Invalid Audio Count
          default: 0
        tie_breaker_count:
          type: integer
          title: Tie Breaker Count
          default: 0
        evaluator_failure_count:
          type: integer
          title: Evaluator Failure Count
          default: 0
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        versions:
          $ref: '#/components/schemas/VersionSet'
        interface_language:
          type: string
          title: Interface Language
          default: en
        revision:
          type: integer
          minimum: 0.0
          title: Revision
          default: 0
        completion_reason:
          type: string
          title: Completion Reason
          default: ''
      additionalProperties: false
      type: object
      required:
      - assessment_id
      - user_id
      - status
      - current_level_index
      - current_item_id
      - current_prompt_kind
      - current_prompt_id
      - form_seed
      - created_at
      - updated_at
      - versions
      title: AssessmentRecord
    AssessmentResult:
      properties:
        assessment_id:
          type: string
          title: Assessment Id
        status:
          $ref: '#/components/schemas/AssessmentStatus'
        result_name:
          type: string
          const: CEFR-aligned Conversational Interaction Placement
          title: Result Name
        confirmed_level:
          anyOf:
          - $ref: '#/components/schemas/CEFRLevel'
          - type: string
            enum:
            - Pre-A1
            - Not determined
          title: Confirmed Level
        first_unconfirmed_level:
          anyOf:
          - $ref: '#/components/schemas/CEFRLevel'
          - type: 'null'
        ceiling_reached:
          type: boolean
          title: Ceiling Reached
        confidence:
          $ref: '#/components/schemas/ResultConfidence'
        confidence_score:
          type: integer
          maximum: 100.0
          minimum: 0.0
          title: Confidence Score
        confidence_score_interpretation:
          type: string
          title: Confidence Score Interpretation
        profile:
          additionalProperties:
            anyOf:
            - $ref: '#/components/schemas/CEFRLevel'
            - type: string
              enum:
              - Pre-A1
              - Not determined
          type: object
          title: Profile
        profile_scores_percent:
          additionalProperties:
            type: integer
          type: object
          title: Profile Scores Percent
        fluency:
          $ref: '#/components/schemas/FluencySessionResult'
        next_level_result:
          type: string
          title: Next Level Result
        summary:
          type: string
          title: Summary
        statistics:
          $ref: '#/components/schemas/AssessmentStatistics'
        grammar_assessed:
          type: boolean
          const: false
          title: Grammar Assessed
          default: false
        pronunciation_diagnostic:
          $ref: '#/components/schemas/PronunciationDiagnostic'
        versions:
          $ref: '#/components/schemas/VersionSet'
        disclaimer:
          type: string
          title: Disclaimer
        validity_warnings:
          items:
            type: string
          type: array
          title: Validity Warnings
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        completion_reason:
          type: string
          title: Completion Reason
      additionalProperties: false
      type: object
      required:
      - assessment_id
      - status
      - result_name
      - confirmed_level
      - first_unconfirmed_level
      - ceiling_reached
      - confidence
      - confidence_score
      - confidence_score_interpretation
      - profile
      - profile_scores_percent
      - fluency
      - next_level_result
      - summary
      - statistics
      - pronunciation_diagnostic
      - versions
      - disclaimer
      - completion_reason
      title: AssessmentResult
    AssessmentStateResponse:
      properties:
        record:
          $ref: '#/components/schemas/AssessmentRecord'
        current_prompt:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Current Prompt
        progress:
          $ref: '#/components/schemas/AssessmentProgress'
      additionalProperties: false
      type: object
      required:
      - record
      - current_prompt
      - progress
      title: AssessmentStateResponse
    AssessmentStatistics:
      properties:
        duration_seconds:
          type: number
          minimum: 0.0
          title: Duration Seconds
        responses_submitted:
          type: integer
          minimum: 0.0
          title: Responses Submitted
        scored_responses:
          type: integer
          minimum: 0.0
          title: Scored Responses
        invalid_audio_responses:
          type: integer
          minimum: 0.0
          title: Invalid Audio Responses
        prompt_repetitions:
          type: integer
          minimum: 0.0
          title: Prompt Repetitions
        clarification_requests:
          type: integer
          minimum: 0.0
          title: Clarification Requests
        tie_breakers_used:
          type: integer
          minimum: 0.0
          title: Tie Breakers Used
      additionalProperties: false
      type: object
      required:
      - duration_seconds
      - responses_submitted
      - scored_responses
      - invalid_audio_responses
      - prompt_repetitions
      - clarification_requests
      - tie_breakers_used
      title: AssessmentStatistics
    AssessmentStatus:
      type: string
      enum:
      - in_progress
      - completed
      - cancelled
      title: AssessmentStatus
    AudioUploadResponse:
      properties:
        assessment_id:
          type: string
          title: Assessment Id
        response_id:
          type: string
          title: Response Id
        audio_uri:
          type: string
          title: Audio Uri
        encrypted:
          type: boolean
          title: Encrypted
          default: true
      additionalProperties: false
      type: object
      required:
      - assessment_id
      - response_id
      - audio_uri
      title: AudioUploadResponse
    Body_upload_original_audio_v1_assessments__assessment_id__audio__response_id__post:
      properties:
        audio:
          type: string
          contentMediaType: application/octet-stream
          title: Audio
      type: object
      required:
      - audio
      title: Body_upload_original_audio_v1_assessments__assessment_id__audio__response_id__post
    CEFRLevel:
      type: string
      enum:
      - A1
      - A2
      - B1
      - B2
      title: CEFRLevel
    CurrentPrompt:
      properties:
        prompt_id:
          type: string
          title: Prompt Id
        item_id:
          type: string
          title: Item Id
        target_level:
          anyOf:
          - $ref: '#/components/schemas/CEFRLevel'
          - type: 'null'
        prompt_kind:
          $ref: '#/components/schemas/PromptKind'
        prompt:
          type: string
          title: Prompt
        clarification_prompt:
          type: string
          title: Clarification Prompt
        response_limit_seconds:
          type: integer
          title: Response Limit Seconds
        prompt_repetitions_allowed:
          type: integer
          title: Prompt Repetitions Allowed
        preparation_seconds:
          type: integer
          maximum: 60.0
          minimum: 0.0
          title: Preparation Seconds
          default: 0
        reference_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Reference Text
      additionalProperties: false
      type: object
      required:
      - prompt_id
      - item_id
      - target_level
      - prompt_kind
      - prompt
      - clarification_prompt
      - response_limit_seconds
      - prompt_repetitions_allowed
      title: CurrentPrompt
    FluencyConfidence:
      type: string
      enum:
      - high
      - medium
      - low
      title: FluencyConfidence
    FluencyEvidenceCount:
      properties:
        eligible_turns:
          type: integer
          minimum: 0.0
          title: Eligible Turns
        total_turns:
          type: integer
          minimum: 0.0
          title: Total Turns
        total_words:
          type: integer
          minimum: 0.0
          title: Total Words
        learner_speech_seconds:
          type: number
          minimum: 0.0
          title: Learner Speech Seconds
        timestamped_turns:
          type: integer
          minimum: 0.0
          title: Timestamped Turns
        timestamp_coverage:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Timestamp Coverage
      additionalProperties: false
      type: object
      required:
      - eligible_turns
      - total_turns
      - total_words
      - learner_speech_seconds
      - timestamped_turns
      - timestamp_coverage
      title: FluencyEvidenceCount
    FluencyFeatures:
      properties:
        word_count:
          type: integer
          minimum: 0.0
          title: Word Count
        response_duration_seconds:
          type: number
          minimum: 0.0
          title: Response Duration Seconds
        speech_duration_seconds:
          type: number
          minimum: 0.0
          title: Speech Duration Seconds
        speech_rate_wpm:
          type: number
          minimum: 0.0
          title: Speech Rate Wpm
        articulation_rate_wpm:
          type: number
          minimum: 0.0
          title: Articulation Rate Wpm
        pace_stability:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Pace Stability
        pause_count:
          type: integer
          minimum: 0.0
          title: Pause Count
        pauses_per_minute:
          type: number
          minimum: 0.0
          title: Pauses Per Minute
        pause_duration_seconds:
          type: number
          minimum: 0.0
          title: Pause Duration Seconds
        pause_ratio:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Pause Ratio
        phonation_ratio:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Phonation Ratio
        mean_length_of_run_words:
          type: number
          minimum: 0.0
          title: Mean Length Of Run Words
        longest_run_words:
          type: integer
          minimum: 0.0
          title: Longest Run Words
        long_pause_count:
          type: integer
          minimum: 0.0
          title: Long Pause Count
        long_pauses_per_minute:
          type: number
          minimum: 0.0
          title: Long Pauses Per Minute
        max_inter_word_gap_seconds:
          type: number
          minimum: 0.0
          title: Max Inter Word Gap Seconds
        filler_count:
          type: integer
          minimum: 0.0
          title: Filler Count
        fillers_per_100_words:
          type: number
          minimum: 0.0
          title: Fillers Per 100 Words
        immediate_repeat_count:
          type: integer
          minimum: 0.0
          title: Immediate Repeat Count
        repeated_phrase_count:
          type: integer
          minimum: 0.0
          title: Repeated Phrase Count
        self_correction_count:
          type: integer
          minimum: 0.0
          title: Self Correction Count
        timing_source:
          type: string
          enum:
          - word_timestamps
          - response_window
          - unavailable
          title: Timing Source
      additionalProperties: false
      type: object
      required:
      - word_count
      - response_duration_seconds
      - speech_duration_seconds
      - speech_rate_wpm
      - articulation_rate_wpm
      - pause_count
      - pauses_per_minute
      - pause_duration_seconds
      - pause_ratio
      - phonation_ratio
      - mean_length_of_run_words
      - longest_run_words
      - long_pause_count
      - long_pauses_per_minute
      - max_inter_word_gap_seconds
      - filler_count
      - fillers_per_100_words
      - immediate_repeat_count
      - repeated_phrase_count
      - self_correction_count
      - timing_source
      title: FluencyFeatures
    FluencyMode:
      type: string
      enum:
      - assessment
      - guided
      - free
      title: FluencyMode
    FluencyObservationRequest:
      properties:
        session_id:
          type: string
          maxLength: 160
          minLength: 1
          title: Session Id
        turn_id:
          type: string
          maxLength: 160
          minLength: 1
          title: Turn Id
        mode:
