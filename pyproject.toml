[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-english-tutor-assessment"
version = "0.1.0"
description = "CEFR-aligned adaptive oral placement assessment for the real-time English tutor"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "pydantic>=2.11,<3.0",
  "python-dotenv>=1.1,<2.0",
  "python-multipart>=0.0.20,<1.0",
  "cryptography>=45,<47",
  "google-genai>=1.29,<2.0",
  "openai>=1.99,<3.0",
  "psycopg[binary,pool]>=3.2,<4.0",
  "boto3>=1.40,<2.0",
]

[project.optional-dependencies]
livekit = [
  "livekit-agents[deepgram,silero]==1.6.6",
  "livekit-plugins-ai-coustics==0.3.0",
]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
  "httpx>=0.28,<1.0",
  "ruff>=0.12,<1.0",
]

[tool.setuptools.packages.find]
include = ["app*", "services*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["services/oral_assessment/tests"]
pythonpath = ["."]

