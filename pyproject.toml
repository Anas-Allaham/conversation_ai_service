[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "conversation-ai-service"
version = "0.1.0"
description = "Realtime English tutor agent and internal conversation-session API"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.16,<2",
  "asyncpg>=0.30,<1",
  "livekit-api>=1.2,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
  "python-dotenv>=1.1,<2",
  "sqlalchemy[asyncio]>=2.0.41,<2.1",
]

[project.optional-dependencies]
agent = [
  "livekit-agents[deepgram,silero]>=1.6.5,<1.7.0",
  "livekit-plugins-ai-coustics==0.3.0",
]
api = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
]
modal = [
  "fastapi>=0.116,<1",
  "modal>=1.1,<2",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "sounddevice>=0.5,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/conversation_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["conversation_ai"]
